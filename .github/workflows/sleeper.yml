name: sleeper-relay
on:
  schedule:
    # UTC pair: one refresh at 06:25 Swiss time in summer and winter.
    - cron: "25 4 * * 2,4"
    - cron: "25 5 * * 2,4"
    - cron: "40 4 * * *"
    - cron: "40 16 * * *"
    - cron: "55 4 * * 2"
    - cron: "55 5 * * 2"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sleeper-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten holen
        run: python3 scripts/sleeper_relay.py
      - name: Spielplan und Verletzungen holen
        run: python3 scripts/nfl_zusatz.py
      - name: Aenderungen committen
        run: |
          git config user.name "sleeper-relay"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "sleeper-relay $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
